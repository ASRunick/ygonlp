[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ygonlp"
version = "0.0.0"
description = "CLI research project for English Yu-Gi-Oh! card text analysis"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["httpx>=0.27", "numpy>=2.0,<3", "scikit-learn>=1.9,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8,<4"]

[project.scripts]
ygonlp = "ygonlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
